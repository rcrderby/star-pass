<!DOCTYPE html>
<html lang="en" data-theme="night" data-motion="subtle">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Pass</title>

  <!--
    Everything this page loads comes from this origin. The Content
    Security Policy in 'deploy/caddy/Caddyfile' is "default-src 'self'"
    with no 'unsafe-inline', so a font, an icon set or a script from
    anywhere else is refused by the browser rather than merely
    discouraged - and the deployment is meant to work on a tailnet with
    no route out (D14), where it would never arrive in the first place.
    Inter and the Phosphor icons are under '/assets' for that reason.

    There is no build step. The stylesheets and the modules below are
    what is committed and what is served; 'web/' is copied into the
    image as it is.
  -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/runs.css">
  <link rel="stylesheet" href="/css/review.css">
  <link rel="stylesheet" href="/css/sending.css">
  <link rel="stylesheet" href="/css/collect.css">
  <link rel="stylesheet" href="/css/settings.css">

  <link rel="preload" href="/assets/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>

  <script type="module" src="/js/main.js"></script>
</head>

<body>
  <!--
    Filled by 'js/main.js'. Empty here rather than holding a copy of
    the shell, because a shell in the markup and a shell in the module
    are two things to keep in step.
  -->
  <div id="app"></div>

  <noscript>
    <p class="failure">
      Star Pass needs JavaScript. Every screen it has is a reading of
      the star-pass API, and the page is what does the reading.
    </p>
  </noscript>
</body>

</html>
