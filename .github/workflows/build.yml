---
# Build the deployable artifacts and smoke test them.
#
# The container image is the deployment target, so a missing runtime
# dependency or a file the application reads at startup but the image
# does not contain must fail here rather than at run time.
#
# The Dockerfile has two targets and each has a job here.  The full one
# is what a build naming no target produces, which is what the
# deployment builds; the Slack one is what the scheduled sign-up
# summary pulls, and is the only artifact this repository publishes.

# Name of the action
name: Build

# Events that trigger the action
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on a branch; never cancel main runs so the
# post-merge run (and status badges) always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  container_image:
    name: Container image
    # Same-repo pushes are already covered by the 'push' event, so only
    # run the pull_request event for forks (their branches are not in
    # this repo and so never trigger 'push').
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # Job permissions
    permissions:
      contents: read

    steps:
      # checkout action documentation
      # https://github.com/marketplace/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No target named, which is how the deployment builds it: the
      # full stage is last in the Dockerfile and a build with no
      # '--target' gets it.
      - name: Build the container image
        run: docker build -t star-pass:ci .

      # Guards the runtime requirements file: every third-party package
      # the application imports must be installed in the image.
      - name: Verify every application module imports
        run: |
          docker run --rm star-pass:ci python -c "
          import star_pass.amplify_responses
          import star_pass.gcal_data
          import star_pass.slack_notify
          import star_pass_api
          print('All star_pass modules imported.')
          "

      # Guards the account the image runs as.  A 'USER' line lost to a
      # rebase reads as nothing at all in a diff of this file, and the
      # deployment would go back to root without a test failing.
      - name: Verify the image does not run as root
        run: |
          uid="$(docker run --rm star-pass:ci id -u)"
          if [ "${uid}" = "0" ]; then
            echo "The image runs as root." >&2
            exit 1
          fi
          echo "Runs as UID ${uid}."

      # Guards what that account can do.  Being non-root is only half
      # of it: the service has to be able to write the database and the
      # '-wal' and '-shm' files SQLite puts beside it, which needs the
      # directory and not merely the file.
      - name: Verify the database directory is writable
        run: |
          docker run --rm star-pass:ci python -c "
          from star_pass._database import connect
          connect(path='/data/ci.db').close()
          print('Wrote the database as a non-root user.')
          "

      # Guards the image contents: importing '_defaults' reads the shift
      # data model, and the CLI resolves the data directories, both from
      # paths outside the package.
      - name: Verify the CLI runs
        env:
          AMPLIFY_TOKEN: ci-placeholder
          GCAL_TOKEN: ci-placeholder
        run: |
          docker run --rm \
            -e AMPLIFY_TOKEN -e GCAL_TOKEN \
            star-pass:ci python /app/__main__.py --help

  # The image the scheduled Slack sign-up summary runs from, and the
  # only job that publishes anything.
  #
  # It is built and smoke tested on every branch, and pushed to the
  # container registry from 'main' alone, so that what a scheduled post
  # pulls is always something a merge produced.
  slack_image:
    name: Slack summary image
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # Job permissions
    #
    # 'packages: write' belongs to this job and to no other, because
    # this is the only one that writes a package.
    permissions:
      contents: read
      packages: write

    steps:
      # checkout action documentation
      # https://github.com/marketplace/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the Slack summary image
        run: docker build --target slack -t star-pass:slack .

      # Guards the core requirements file the same way the full image's
      # step guards the runtime one: every package the summary imports
      # must be installed in the target that carries only those.
      - name: Verify the summary's modules import
        run: |
          docker run --rm star-pass:slack python -c "
          import star_pass.amplify_responses
          import star_pass.gcal_data
          import star_pass.slack_notify
          import star_pass_cli
          print('All modules the summary needs imported.')
          "

      # Guards what the target is for.  A dependency that finds its way
      # back into the core requirements file would leave the two images
      # identical and nothing else would say so.
      - name: Verify the web dependencies are absent
        run: |
          docker run --rm star-pass:slack python -c "
          from importlib.util import find_spec
          carried = [
              name
              for name in ('fastapi', 'uvicorn', 'httpx2')
              if find_spec(name) is not None
          ]
          if carried:
              raise SystemExit(f'The Slack image must not carry: {carried}')
          print('None of the API service dependencies is installed.')
          "

      # The same guard as the full image's.  This is the only image
      # this repository publishes, so what it runs as is what a
      # scheduled post runs as.
      - name: Verify the image does not run as root
        run: |
          uid="$(docker run --rm star-pass:slack id -u)"
          if [ "${uid}" = "0" ]; then
            echo "The image runs as root." >&2
            exit 1
          fi
          echo "Runs as UID ${uid}."

      # Guards the entry point, which imports the command line and the
      # contract on the way to the summary.  '--help' exercises that
      # import without reaching Amplify or Slack.
      - name: Verify the summary runs
        env:
          AMPLIFY_TOKEN: ci-placeholder
          SLACK_BOT_TOKEN: ci-placeholder
        run: |
          docker run --rm \
            -e AMPLIFY_TOKEN -e SLACK_BOT_TOKEN \
            star-pass:slack python /app/__main__.py -s --help

      # Two tags: the moving one a scheduled post pulls, and one naming
      # the commit, so a post can be traced to what produced it and a
      # rollback has something to name.
      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "${REGISTRY_TOKEN}" |
            docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          docker tag star-pass:slack "${IMAGE}:slack"
          docker tag star-pass:slack "${IMAGE}:slack-${COMMIT}"
          docker push "${IMAGE}:slack"
          docker push "${IMAGE}:slack-${COMMIT}"

  python_package:
    name: Python package
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # Job permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # setup-python action documentation
      # https://github.com/marketplace/actions/setup-python
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      # Guards the package configuration: automatic flat-layout
      # discovery fails on this repository, so the packages are declared
      # explicitly and a build must keep succeeding.
      - name: Build the wheel
        run: python -m build --wheel
