---
# Perform linting with GitHub Super Linter
## https://github.com/super-linter/super-linter

# Name of the action
name: Super Linter

# Events that trigger the action
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on a branch; never cancel main runs so the
# post-merge run (and status badges) always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint_repository:
    name: Lint repository files
    # Same-repo pushes are already covered by the 'push' event, so only
    # run the pull_request event for forks (their branches are not in
    # this repo and so never trigger 'push').
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # Job permissions
    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      # checkout action documentation
      # https://github.com/marketplace/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fetch all history for all branches and tags
          fetch-depth: 0

      # Super Linter action documentation
      # https://github.com/marketplace/actions/super-linter
      # The slim image drops language toolchains this repository does
      # not lint (Rust, .NET, PowerShell, ARM templates), which makes
      # the image the runner pulls smaller.  Every validator enabled
      # below is present in it.  Same commit as the standard action;
      # only the path differs.
      - name: Super Linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918  # v8
        # Configuration settings
        env:
          # Report status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Specify languages to lint
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JSCPD: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_YAML: true
          # Language-specific configuration
          YAML_ERROR_ON_WARNING: true
          # Exclusions
          # 'docs/design' holds a received design handoff: planning
          # documents, an API surface sketch, and the authoring files
          # behind a prototype.  They are a record of what was decided,
          # so they are kept as delivered rather than rewritten to this
          # repository's prose and formatting rules.  Per-validator
          # excludes are not honored by this version, so the exclusion
          # is global; GITLEAKS scans the repository rather than the
          # filtered file list, so the directory stays covered by it.
          FILTER_REGEX_EXCLUDE: (.*\.devcontainer/devcontainer\.json$|.*docs/design/.*)
