# Python package configuration file
## https://packaging.python.org/en/latest/

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools"
]

[project]
authors = [
  {name = "Breadpool", email = "breadpool@rosecityrollers.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Galaxy Digital Amplify volunteer management system administrators.",
  "Topic :: Galaxy Digital Amplify :: Volunteer Management :: Automation",
  "License :: OSI Approved :: Apache Software License",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "python_dotenv==1.2.2",
  "pyyaml==6.0.3",
  "dateparser==1.4.1",
  "jsonschema==4.26.0",
  "pandas==3.0.3",
  "python-Levenshtein==0.27.3",
  "thefuzz==0.22.1",
  "requests==2.34.2",
  "slack_sdk==3.43.0"
]
description = "Tool to automate manual volunteer management in Galaxy Digital Amplify."
dynamic = ["version"]
name = "star-pass"
readme = "README.md"
requires-python = ">= 3.12"

# A 'star-pass' console script is deliberately not declared yet.  The
# entry point would be 'app.__main__:main', but that module imports
# 'star_pass.<module>' as a top level package, which only resolves when
# the 'app' directory is on sys.path (as it is for a checkout and for
# the container image, which sets PYTHONPATH=/app).  Installed, the
# package is 'app.star_pass', so every import in the entry point would
# fail.  'star_pass._defaults' also reads 'models/shift_info.yml' and
# the 'data' directories from paths outside the package, which a wheel
# in site-packages cannot reach.  Supporting an installable
# distribution is its own phase of work; run star-pass from a checkout
# or the container image until then.

[project.urls]
Repository = "https://github.com/rcrderby/star-pass.git"

[tool.setuptools]
# Declare the packages explicitly.  Automatic flat-layout discovery
# fails on this repository ("Multiple top-level packages discovered in
# a flat-layout: ['app', 'data', 'models']") because the data and model
# directories sit alongside the import root.
packages = [
  "app",
  "app.star_pass"
]

[tool.setuptools.dynamic]
# 'readme' is declared statically in [project] above, so it must not be
# repeated here; only fields listed in [project] 'dynamic' belong in
# this table.
version = {attr = "app.__version__"}

[tool.coverage.run]
# Measure the application only.  The previous '--cov=.' also measured
# the test files themselves, which inflated the reported percentage.
source = ["app"]

[tool.coverage.report]
# Enforce a floor rather than reporting a number nothing acts on.  Set
# just below the coverage at the time of writing, so a genuine drop
# fails the run while ordinary variation does not.
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
# Put the 'app' directory on sys.path so tests can `import star_pass...`
# without the ./app/__main__.py script-directory trick.
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "--verbose"