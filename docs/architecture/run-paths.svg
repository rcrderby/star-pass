<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 870" width="1060" height="870" role="img" aria-labelledby="title description">
  <title id="title">A run, and what each step touches</title>
  <desc id="description">A run collects a window, is reviewed, is previewed and is sent. Every step reads and writes the database. Collecting reads Google Calendar and the Amplify listings; the preview and the send read and write Amplify. Collecting and sending run as jobs, watched over the job stream. The scheduled Slack post runs elsewhere and touches none of it.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1060" height="870" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="24" y="36" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">A run, and what each step touches</text>
  <line x1="24" y1="700" x2="1036" y2="700" stroke="#64748b" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="300" y="64" width="360" height="56" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="480" y="89" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">The page in the browser</text>
  <text x="480" y="105" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">every call below goes through Caddy and the frontend</text>
  <rect x="60" y="150" width="190" height="424" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="155" y="303" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">star_pass.db</text>
  <text x="155" y="319" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">runs, revisions,</text>
  <text x="155" y="335" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">events, the change</text>
  <text x="155" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">log, and the shifts</text>
  <text x="155" y="367" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">a send recorded</text>
  <text x="155" y="383" font-size="11" font-weight="400" fill="#475569" text-anchor="middle"></text>
  <text x="155" y="399" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">read by every step</text>
  <text x="155" y="415" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">below, written by</text>
  <text x="155" y="431" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">all but the preview</text>
  <rect x="300" y="150" width="360" height="88" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="175" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">1. Collect</text>
  <text x="480" y="191" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST /v1/runs</text>
  <text x="480" y="207" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">runs as a job on a thread</text>
  <text x="480" y="223" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">watched over the job stream below</text>
  <rect x="300" y="262" width="360" height="88" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="287" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2. Review</text>
  <text x="480" y="303" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">GET /v1/runs/{id}</text>
  <text x="480" y="319" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST and PATCH /v1/runs/{id}/events</text>
  <text x="480" y="335" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">every edit writes a log entry</text>
  <rect x="300" y="374" width="360" height="88" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="399" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">3. Preview</text>
  <text x="480" y="415" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">GET /v1/runs/{id}/preview</text>
  <text x="480" y="431" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">reads Amplify before it answers</text>
  <text x="480" y="447" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">writes nothing at all</text>
  <rect x="300" y="486" width="360" height="88" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="511" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">4. Send</text>
  <text x="480" y="527" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST /v1/runs/{id}/send</text>
  <text x="480" y="543" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">runs as a job on a thread</text>
  <text x="480" y="559" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">resumable where it was interrupted</text>
  <rect x="300" y="598" width="360" height="76" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="625" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">The job stream</text>
  <text x="480" y="641" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">GET /v1/jobs/{id}/events</text>
  <text x="480" y="657" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">server-sent, and passed on unbuffered</text>
  <rect x="710" y="88" width="320" height="76" rx="8" fill="#f6f7f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="870" y="115" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Google Calendar</text>
  <text x="870" y="131" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">the events in the window</text>
  <text x="870" y="147" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">read once, at collection</text>
  <rect x="710" y="262" width="320" height="312" rx="8" fill="#f6f7f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="870" y="359" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Amplify</text>
  <text x="870" y="375" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">the listings, read at collection</text>
  <text x="870" y="391" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">the shifts it already holds,</text>
  <text x="870" y="407" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">read again at preview and</text>
  <text x="870" y="423" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">once more per opportunity</text>
  <text x="870" y="439" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">as a send writes to it</text>
  <text x="870" y="455" font-size="11" font-weight="400" fill="#475569" text-anchor="middle"></text>
  <text x="870" y="471" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">the only service outside</text>
  <text x="870" y="487" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">this host that a run reaches</text>
  <rect x="60" y="752" width="230" height="76" rx="8" fill="#f6f7f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175" y="779" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">GitHub Actions</text>
  <text x="175" y="795" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Wednesday and Friday</text>
  <text x="175" y="811" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">19:12 UTC</text>
  <rect x="330" y="752" width="230" height="76" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="445" y="779" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">The slim image</text>
  <text x="445" y="795" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">star-pass -s</text>
  <text x="445" y="811" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">no database, no page</text>
  <rect x="600" y="752" width="190" height="76" rx="8" fill="#f6f7f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="695" y="787" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Amplify</text>
  <text x="695" y="803" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">read, never written</text>
  <rect x="830" y="752" width="170" height="76" rx="8" fill="#f6f7f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="915" y="787" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Slack</text>
  <text x="915" y="803" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">one post</text>
  <line x1="480" y1="120" x2="480" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="480" y1="238" x2="480" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="480" y1="350" x2="480" y2="374" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="480" y1="462" x2="480" y2="486" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="250" y1="194" x2="300" y2="194" stroke="#334155" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <line x1="250" y1="306" x2="300" y2="306" stroke="#334155" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <line x1="250" y1="418" x2="300" y2="418" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="250" y1="530" x2="300" y2="530" stroke="#334155" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <line x1="660" y1="174" x2="710" y2="126" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="660" y1="224" x2="710" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="660" y1="418" x2="710" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="660" y1="530" x2="710" y2="500" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="480" y1="574" x2="480" y2="598" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#head)"/>
  <line x1="290" y1="790" x2="330" y2="790" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="560" y1="790" x2="600" y2="790" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="790" y1="790" x2="830" y2="790" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="24" y="722" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">The scheduled Slack post, which none of the above reaches and which reaches none of it</text>
  <text x="24" y="852" font-size="11" font-weight="400" fill="#475569" text-anchor="start">It runs on a machine GitHub creates and destroys, from an image holding what the -s run mode imports and nothing else: no API service, no frontend, no database and no page to serve.</text>
  </g>
</svg>
