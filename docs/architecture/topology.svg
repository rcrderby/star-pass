<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-labelledby="title description">
  <title id="title">star-pass deployment: two networks, one published port</title>
  <desc id="description">A browser reaches Caddy, the only service publishing a port. Caddy proxies to the frontend on the edge network. The frontend proxies to the API on the backend network, which Caddy is not on. The API alone holds the Amplify credential and the database, and alone reaches Amplify and Google Calendar.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1060" height="470" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <text x="24" y="36" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">star-pass deployment: two networks, one published port</text>
  <rect x="184" y="118" width="430" height="176" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="198" y="281" font-size="12" font-weight="600" fill="#64748b" text-anchor="start">edge network</text>
  <rect x="394" y="136" width="460" height="252" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="408" y="375" font-size="12" font-weight="600" fill="#64748b" text-anchor="start">backend network</text>
  <rect x="24" y="156" width="130" height="98" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="89" y="194" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Browser</text>
  <text x="89" y="210" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">no credential</text>
  <text x="89" y="226" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">session cookie</text>
  <rect x="204" y="156" width="160" height="98" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="284" y="186" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Caddy</text>
  <text x="284" y="202" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">only published port</text>
  <text x="284" y="218" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">80 and 443</text>
  <text x="284" y="234" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">TLS ends here</text>
  <rect x="414" y="156" width="180" height="98" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="504" y="186" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Frontend</text>
  <text x="504" y="202" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">adds the API token</text>
  <text x="504" y="218" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">checks the origin</text>
  <text x="504" y="234" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">no Amplify credential</text>
  <rect x="644" y="156" width="180" height="98" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="734" y="186" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">API</text>
  <text x="734" y="202" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">holds AMPLIFY_TOKEN</text>
  <text x="734" y="218" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">reads ./.env read-only</text>
  <text x="734" y="234" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">owns the database</text>
  <rect x="659" y="300" width="150" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="734" y="326" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">star_pass.db</text>
  <text x="734" y="342" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">a named volume</text>
  <rect x="884" y="141" width="150" height="58" rx="8" fill="#f6f7f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="959" y="167" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Amplify</text>
  <text x="959" y="183" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">read and written</text>
  <rect x="884" y="225" width="150" height="58" rx="8" fill="#f6f7f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="959" y="251" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Google Calendar</text>
  <text x="959" y="267" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">read at collection</text>
  <line x1="154" y1="205" x2="204" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="160" y="183" width="38" height="15" fill="#ffffff"/>
  <text x="179" y="194" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">HTTPS</text>
  <line x1="364" y1="205" x2="414" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="373" y="183" width="33" height="15" fill="#ffffff"/>
  <text x="389" y="194" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">HTTP</text>
  <line x1="594" y1="205" x2="644" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <rect x="603" y="183" width="33" height="15" fill="#ffffff"/>
  <text x="619" y="194" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">HTTP</text>
  <line x1="734" y1="254" x2="734" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="824" y1="187" x2="884" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <line x1="824" y1="223" x2="884" y2="254" stroke="#334155" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="24" y="424" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Caddy is absent from the backend network, so the frontend is the only path to the process holding the Amplify credential, rather than merely the intended one.</text>
  <text x="24" y="444" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Neither application service publishes a port, which is why the documentation the API serves at /docs and /redoc cannot be reached from the host.</text>
  </g>
</svg>
