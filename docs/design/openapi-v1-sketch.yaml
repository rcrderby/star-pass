# Star Pass v1 API — design-side sketch
#
# NOT the committed spec. Per D15 the real spec is generated by FastAPI and this
# file is deleted once that exists. Its only job is to check, on paper, that
# every screen in `Create Shifts v2.dc.html` can be served by the API we plan —
# and to surface the endpoints the plan was missing (see WHAT THIS SURFACED at
# the bottom of this file).
#
# Conventions throughout:
#   - Errors are application/problem+json (RFC 9457) with a `reference` id.
#     Never an upstream body.
#   - All writes require an Idempotency-Key header.
#   - Dates and times are league-local (America/Los_Angeles). Window end is
#     EXCLUSIVE in the domain; the API takes the inclusive last day the UI shows
#     and does the +1 itself, so no client ever computes it.
#   - Ids only, never file paths.

openapi: 3.1.0
info:
  title: Star Pass
  version: 1.0.0
  description: >
    Creates Amplify officiating shifts from Google Calendar events. This API is
    the contract; the CLI and the web BFF are both clients of it.

servers:
  - url: /v1

security:
  - bearer: []

tags:
  - name: runs
  - name: jobs
  - name: events
  - name: service

paths:
  /health:
    get:
      tags: [service]
      summary: Liveness. Unauthenticated.
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /version:
    get:
      tags: [service]
      summary: Version and build. Requires config:read.
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  core: { type: string, description: star_pass core package version }

  /config:
    get:
      tags: [service]
      summary: Resolved configuration, read only (D8 — no write endpoint exists).
      responses:
        "200":
          description: What the service resolved at start up
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone: { type: string, example: America/Los_Angeles }
                  matchThreshold: { type: integer, example: 80 }
                  neverCollectTitles:
                    type: array
                    items: { type: string }
                  calendars:
                    type: array
                    items: { $ref: "#/components/schemas/CalendarConfig" }
                  retention:
                    type: object
                    properties:
                      csvDays: { type: integer, example: 90 }
                      jobLogDays: { type: integer, example: 90 }
                  rows:
                    type: array
                    description: >
                      Display rows for the Settings table — name, value, source.
                      Served rather than composed in the client so the CLI can
                      print the same table.
                    items: { $ref: "#/components/schemas/ConfigRow" }

  /credentials:
    get:
      tags: [service]
      summary: Credential status. Never the secret, never a way to write one.
      responses:
        "200":
          description: One entry per credential
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }

  /credentials/{name}/test:
    post:
      tags: [service]
      summary: Make one real upstream call to check a credential. Rate limited.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [amplify, gcal] } }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  lastFour: { type: string }
                  checkedAt: { type: string, format: date-time }
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"

  /runs:
    get:
      tags: [runs]
      summary: Runs, newest first. Includes any run still collecting.
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
    post:
      tags: [runs]
      summary: Start a collection. Returns the run and its job.
      description: >
        The run id is minted here, before any calendar work, so the collecting
        screen has an id to show and can be reattached to.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  job: { $ref: "#/components/schemas/Job" }
        "422":
          $ref: "#/components/responses/Problem"

  /runs/{runId}:
    get:
      tags: [runs]
      summary: One run, with its current revision's events.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "404":
          $ref: "#/components/responses/Problem"

  /runs/{runId}/recollect:
    post:
      tags: [runs]
      summary: Replace this run from the calendar. Destroys edits and revisions.
      description: >
        The UI warns with a change count first. `expectedChangeCount` is echoed
        back from the run so a stale tab cannot silently discard newer edits.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedChangeCount: { type: integer }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409":
          $ref: "#/components/responses/Problem"

  /runs/{runId}/events:
    patch:
      tags: [events]
      summary: Edit events in the current revision. One call per user action.
      description: >
        The review screen saves as you type, and every action is one of these:
        set the opportunity, set a shift start or end, set slots for one role,
        nudge selected events by ±15 minutes, reset slots to usual, remove
        events, undo an event's changes. Sent as a list so a bulk action on 30
        selected rows is one request, one log entry and one revision delta.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items: { $ref: "#/components/schemas/EventOperation" }
      responses:
        "200":
          description: The updated revision, plus the log entries it produced
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  log:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [events]
      summary: Pull an event the calendar search never looked at into the run.
      description: >
        Only events in the `search` group may be added. Cancelled, all-day and
        untitled events are informational and rejected here — the check is
        server-side, not a disabled button.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uncollectedId]
              properties:
                uncollectedId: { type: string }
      responses:
        "201":
          description: The event as added, with no opportunity matched yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "409":
          description: Not addable (cancelled, all-day, untitled, already added)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /runs/{runId}/uncollected:
    get:
      tags: [events]
      summary: Everything in the window that will not become a shift, and why.
      description: >
        Served from what the collection stored, NOT a live calendar read — the
        Not collected tab shows a count on every page load and must not cost a
        Google call. The second unfiltered read happens once, during collection.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Grouped by reason
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UncollectedGroup" }

  /runs/{runId}/revisions:
    get:
      tags: [runs]
      summary: Revision list for this run.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Revisions, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Revision" }
    post:
      tags: [runs]
      summary: Seal the current revision and start a new one.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The new current revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }

  /runs/{runId}/revisions/{n}/revert:
    post:
      tags: [runs]
      summary: Revert to a revision. Never destructive — seals first, then reverts.
      description: >
        Reverting to revision 1 restores the list exactly as collected, which
        also removes events that were added by hand and returns them to the
        Not collected list. That is server semantics the UI relies on.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - { name: n, in: path, required: true, schema: { type: integer } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The run detail after reverting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }

  /runs/{runId}/preview:
    get:
      tags: [runs]
      summary: What a send would create, grouped by Amplify opportunity.
      description: >
        Grouping is by opportunity, never by category — several categories share
        one need id. Includes the duplicate check, so the client never derives
        "already in Amplify" itself.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
        "502":
          description: Amplify could not be read. The client shows a reference id.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /runs/{runId}/send:
    post:
      tags: [runs]
      summary: Create the shifts in Amplify. Async, idempotent, resumable.
      description: >
        Re-runs the duplicate check inside the send transaction before writing.
        `scope: failed` retries only what failed, and needs a NEW
        Idempotency-Key; per-shift keys are what make that safe.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: [all, failed], default: all }
                expectedShiftCount:
                  type: integer
                  description: >
                    The number the confirmation dialog showed. If the real count
                    differs, the send is refused rather than surprising the user.
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409":
          description: Nothing left to send, or the count no longer matches
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Job status. Reattachable — this is how a reopened tab catches up.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /jobs/{jobId}/events:
    get:
      tags: [jobs]
      summary: Progress as server-sent events. Same data as polling the job.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: text/event-stream of Job snapshots
          content:
            text/event-stream:
              schema: { type: string }

  /jobs/{jobId}/resume:
    post:
      tags: [jobs]
      summary: Resume an interrupted job. Only ever by explicit request (D10).
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /unmatched-titles:
    get:
      tags: [service]
      summary: Titles noted as ones the matching should learn.
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnmatchedTitle" }
    post:
      tags: [service]
      summary: Note a title. Append only — this never edits matching rules.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                runId: { type: string }
                source: { type: string, enum: [uncollected, unmatched] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedTitle" }

  /unmatched-titles/{id}:
    delete:
      tags: [service]
      summary: Remove a note.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >
        Static token from the environment now; OIDC-issued JWT later (D3). The
        browser never holds one — it reaches the API through a same-origin BFF
        with an httpOnly session cookie (D4).

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, example: r-9f42 }
      description: Server-minted. Never a file path.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Sanitized error with a reference id
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, reference]
      properties:
        type: { type: string, format: uri }
        title: { type: string, example: Amplify did not answer }
        status: { type: integer }
        detail:
          type: string
          description: >
            Written for a person and safe to display. Upstream response bodies
            are never included — they can carry tokens and volunteer PII.
        reference:
          type: string
          example: ref 7c1d94
          description: Correlates with the server log, where full detail lives.

    CalendarConfig:
      type: object
      properties:
        key: { type: string, enum: [practices, events] }
        label: { type: string }
        searchTerms:
          type: array
          items: { type: string }
          description: Empty means every event on the calendar.

    ConfigRow:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        source: { type: string, example: Default }

    Credential:
      type: object
      properties:
        name: { type: string, enum: [amplify, gcal] }
        label: { type: string }
        lastFour: { type: string }
        pathVar: { type: string, example: AMPLIFY_TOKEN_FILE }
        path: { type: string, example: /run/secrets/star-pass/amplify_token }
        readAt: { type: string, format: date-time }
        ok: { type: boolean }
        checkedAt: { type: string, format: date-time, nullable: true }

    Window:
      type: object
      required: [firstDay, lastDay]
      properties:
        firstDay: { type: string, format: date }
        lastDay:
          type: string
          format: date
          description: Inclusive, as shown in the UI. The API applies the +1 itself.
        timezone: { type: string, readOnly: true, example: America/Los_Angeles }

    CollectRequest:
      type: object
      required: [calendar, window]
      properties:
        calendar: { type: string, enum: [practices, events] }
        window: { $ref: "#/components/schemas/Window" }

    Run:
      type: object
      properties:
        id: { type: string }
        calendar: { type: string, enum: [practices, events] }
        label: { type: string, example: Practices }
        window: { $ref: "#/components/schemas/Window" }
        windowLabel: { type: string, example: Aug 1 – Sep 7 2026 }
        collectedAt: { type: string, format: date-time }
        revisedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [collecting, unsent, partly_sent, sent]
        sentAt: { type: string, format: date-time, nullable: true }
        counts:
          type: object
          properties:
            events: { type: integer }
            shifts: { type: integer }
            uncollected: { type: integer }
            unmatched: { type: integer }
        currentRevision: { type: integer }
        activeJobId: { type: string, nullable: true }

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/Event" }
            log:
              type: array
              items: { $ref: "#/components/schemas/LogEntry" }
            opportunities:
              type: array
              description: >
                Amplify titles for every need id this run touches, resolved
                during collection and stored. The review rows show them, so they
                cannot be a preview-only lookup.
              items: { $ref: "#/components/schemas/Opportunity" }

    Opportunity:
      type: object
      properties:
        needId: { type: string, example: "905196" }
        title: { type: string, example: Junior Games - NSOs }
        url: { type: string, format: uri }
        maxLength: { type: integer, nullable: true }
        offsetStart: { type: integer }
        offsetEnd: { type: integer }
        defaultSlots: { type: integer }

    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        calendarStart: { type: string, example: "19:00" }
        calendarEnd: { type: string, example: "21:00" }
        shiftStart: { type: string, example: "19:15" }
        shiftEnd: { type: string, example: "21:30" }
        lengthMinutes: { type: integer }
        cappedAt:
          type: integer
          nullable: true
          description: Set when the opportunity's max_length shortened the shift.
        category: { type: string, nullable: true }
        match:
          type: object
          nullable: true
          properties:
            kind: { type: string, enum: [keyword, fuzzy] }
            keyword: { type: string, nullable: true }
            score: { type: integer, nullable: true }
        addedByHand: { type: boolean }
        duplicateOf:
          type: string
          nullable: true
          description: Another event id in this run that would create the same shift.
        roles:
          type: array
          items:
            type: object
            properties:
              needId: { type: string }
              slots: { type: integer }
              edited: { type: boolean }
        blocking:
          type: boolean
          description: No opportunity matched, so this event blocks the whole send.

    EventOperation:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum:
            [set_category, set_start, set_end, set_slots, nudge, reset_slots, remove, undo]
        eventIds:
          type: array
          items: { type: string }
        category: { type: string }
        time: { type: string, example: "18:15" }
        needId: { type: string }
        slots: { type: integer }
        minutes: { type: integer, example: -15 }

    LogEntry:
      type: object
      properties:
        at: { type: string, format: date-time }
        text:
          type: string
          description: >
            Written server-side so the change log survives a reload and reads
            identically in the terminal.

    Revision:
      type: object
      properties:
        n: { type: integer }
        at: { type: string, format: date-time }
        label: { type: string, example: As collected }
        changes: { type: integer }
        current: { type: boolean }

    UncollectedGroup:
      type: object
      properties:
        reason: { type: string, enum: [search, excluded, allday, untitled] }
        label: { type: string }
        note: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string, nullable: true }
              date: { type: string, format: date }
              when: { type: string, example: 7:00 to 9:00 pm }
              addable:
                type: boolean
                description: True only in the `search` group.

    ShiftIdentity:
      type: object
      description: >
        The unit of duplicate safety and of idempotency. Never a count — a count
        cannot tell you WHICH shifts already exist.
      required: [needId, date, start, end]
      properties:
        needId: { type: string }
        date: { type: string, format: date }
        start: { type: string, example: "19:15" }
        end: { type: string, example: "21:30" }

    Preview:
      type: object
      properties:
        checkedAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            willCreate: { type: integer }
            alreadyInAmplify: { type: integer }
            repeatedRows: { type: integer }
            blockingEvents: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              needId: { type: string }
              title: { type: string }
              willCreate: { type: integer }
              slots: { type: integer }
              firstDate: { type: string, format: date }
              lastDate:
                type: string
                format: date
                description: Of the shifts that will be created — not of all of them.
              skipped:
                type: array
                description: The identities already in Amplify, so the UI can name them.
                items: { $ref: "#/components/schemas/ShiftIdentity" }
        blockers:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string }
              reason: { type: string, enum: [no_opportunity, ends_before_start, no_slots] }

    Job:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [collect, recollect, send] }
        runId: { type: string }
        state:
          type: string
          enum: [running, succeeded, failed, interrupted, cancelled]
          description: >
            `interrupted` is set on boot for jobs that were running when the
            service stopped. Never resumed automatically (D10).
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        steps:
          type: array
          description: Collection steps, in order — the collecting screen's list.
          items:
            type: object
            properties:
              key: { type: string, enum: [read, filter, match, write] }
              label: { type: string }
              state: { type: string, enum: [pending, running, done, failed] }
              detail: { type: string }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
        results:
          type: array
          description: Per-opportunity send results, including partial failure.
          items:
            type: object
            properties:
              needId: { type: string }
              title: { type: string }
              state: { type: string, enum: [pending, sending, done, failed] }
              created: { type: integer }
              skipped: { type: integer }
              error: { $ref: "#/components/schemas/Problem" }
        error: { $ref: "#/components/schemas/Problem" }

    UnmatchedTitle:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        runId: { type: string, nullable: true }
        source: { type: string, enum: [uncollected, unmatched] }
        notedAt: { type: string, format: date-time }
        principal: { type: string, description: Recorded per D13. }

# ---------------------------------------------------------------------------
# WHAT THIS SURFACED
#
# Writing the surface against the real screens turned up five things the plan
# in api-and-security-plan.md §5 did not have. All five are additions to that
# list, not changes of direction.
#
# 1. Event editing was missing entirely. §5 listed collect, preview and send,
#    but the review screen edits continuously — opportunity, times, slots,
#    nudge, reset, remove, undo, and all of those in bulk over a selection.
#    That is PATCH /runs/{id}/events with an operation list. It is the most used
#    endpoint in the product and it was not in the plan.
#
# 2. The change log has to be server-side. It is currently built in the client,
#    which means it dies on reload and the CLI cannot show it. Since every edit
#    is now an API call, the log is the natural response to those calls.
#
# 3. Opportunity titles must be resolved during collection and stored on the
#    run, not fetched at preview time. The review rows show Amplify titles, so
#    a preview-only lookup would leave the main screen unable to label anything.
#
# 4. `uncollected` must be served from stored collection data, not a live
#    calendar read. The Not collected tab shows a count on every load; a live
#    read would mean a Google call per page view and a second source of truth.
#
# 5. Two guards that only exist because the UI shows a number first:
#    `expectedChangeCount` on recollect and `expectedShiftCount` on send. Both
#    let the server refuse when what the user was shown no longer matches
#    reality — cheaper than making the client re-check, and it closes the stale
#    tab case that a confirmation dialog otherwise invites.
#
# One thing deliberately still absent: no endpoint writes credentials (D8), and
# nothing accepts a file path or CLI arguments.
# ---------------------------------------------------------------------------
