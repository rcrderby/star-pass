# Shift information model: map Google Calendar event titles to Amplify
# need IDs. Each category holds its shift configuration (need IDs, slots,
# timing) plus the list of title keywords ('aliases') that map to it.
# To add a new team or event, add its keyword to the relevant category's
# 'aliases' list. When a title matches more than one alias, the longest
# alias wins.

# Amplify need ID reference
## 607810: Junior Scrimmages - SOs
## 607934: Adult Scrimmages - SOs
## 628861: Adult Scrimmages - NSOs
## 628862: Junior Scrimmages - NSOs
## 773454: Officials Practice
## 879609: Adult Games - NSOs
## 879610: Adult Games - SOs
## 892230: Coaches: Officials Practice
## 905196: Junior Games - NSOs
## 905197: Junior Games - SOs

---
calendar:

  # ----- 'Events' calendar (games) ----- #
  events:
    description: Calendar with game information
    categories:

      adult_game:
        description: Adult Games
        group: adults
        initiative: officiating
        type: game
        aliases:
          - aoa
          - axles
          - bb
          - bnb
          - 'break neck betties'
          - gnr
          - 'guns n rollers'
          - hh
          - 'heartless heathers'
          - hr
          - 'high rollers'
          - justice
          - wheels
          - woj
          - wreckers
        need_ids:
          - description: NSOs
            id: 879609
            max_length: 165
            offset_start: 15
            offset_end: 30
            slots: 12
          - description: SOs
            id: 879610
            max_length: 165
            offset_start: 15
            offset_end: 30
            slots: 8

      junior_game_petals:
        description: Rose Petals Games
        group: juniors
        initiative: officiating
        type: game
        aliases:
          - 'bad apples'
          - ba
          - 'killer bees'
          - kb
          - petals
          - ptt
          - 'skaters of doom'
          - sod
        need_ids:
          - description: NSOs
            id: 905196
            max_length: 135
            offset_start: -15
            offset_end: 30
            slots: 12
          - description: SOs
            id: 905197
            max_length: 135
            offset_start: -15
            offset_end: 30
            slots: 8

      junior_game_buds:
        description: Rose Buds HT Games
        group: juniors
        initiative: officiating
        type: game
        aliases:
          - bh
          - 'bleeding hearts'
          - buds
          - 'death scar derby droids'
          - dsdd
          - ntt
          - 'rainbow bites'
          - rbb
          - roses
          - rtt
          - ua
          - 'undead avengers'
        need_ids:
          - description: NSOs
            id: 905196
            max_length: 165
            offset_start: 0
            offset_end: 75
            slots: 12
          - description: SOs
            id: 905197
            max_length: 165
            offset_start: 0
            offset_end: 75
            slots: 8

    # Fallback when no alias matches: empty IDs signal 'operator must review'.
    default:
      description: Unknown Game
      group: null
      initiative: officiating
      type: game
      need_ids:
        - description: NSOs
          id: ''
          max_length: 165
          offset_start: 0
          offset_end: 0
          slots: 12
        - description: SOs
          id: ''
          max_length: 165
          offset_start: 0
          offset_end: 0
          slots: 8

  # ----- 'Practices' calendar (scrimmages and practices) ----- #
  practices:
    description: Calendar with scrimmages and practices information
    categories:

      adult_scrimmage:
        description: Adult Scrimmages
        group: adults
        initiative: officiating
        type: scrimmage
        aliases:
          - 'adult scrimmage'
          - 'woj scrimmage'
          - 'wreckers scrimmage'
          - wreckers
        need_ids:
          - description: NSOs
            id: 628861
            max_length: null
            offset_start: 0
            offset_end: 0
            slots: 20
          - description: SOs
            id: 607934
            max_length: null
            offset_start: 0
            offset_end: 0
            slots: 20

      junior_scrimmage:
        description: Junior Scrimmages
        group: juniors
        initiative: officiating
        type: scrimmage
        aliases: ['petals scrimmage', 'buds ntt scrimmage', 'buds ht scrimmage']
        need_ids:
          - description: NSOs
            id: 628862
            max_length: null
            offset_start: 0
            offset_end: 0
            slots: 20
          - description: SOs
            id: 607810
            max_length: null
            offset_start: 0
            offset_end: 0
            slots: 20

      # One category for everybody, which is why 'group' is null:
      # officiating practice serves adults and juniors alike, and
      # naming one of them would be untrue.  The aliases carry no
      # group word for the same reason, and none is needed -- a title
      # that names a group still holds 'officials' or 'officiating',
      # and reaches this category on that.
      officiating_practice:
        description: Officials Practice
        group: null
        initiative: officiating
        type: practice
        aliases: [officials, officiating]
        need_ids:
          - description: Attendees
            id: 773454
            max_length: null
            offset_start: 0
            offset_end: 0
            slots: 20
          - description: Coaches
            id: 892230
            max_length: null
            offset_start: 0
            offset_end: 0
            slots: 2

    # Fallback when no alias matches: empty IDs signal 'operator must review'.
    default:
      description: Unknown Scrimmage
      group: null
      initiative: officiating
      type: scrimmage
      need_ids:
        - description: NSOs
          id: ''
          max_length: null
          offset_start: 0
          offset_end: 0
          slots: 20
        - description: SOs
          id: ''
          max_length: null
          offset_start: 0
          offset_end: 0
          slots: 20
